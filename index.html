<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Glass Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background: linear-gradient(
                135deg,
                #090979,
                #00d4ff
            );
        }

        /* Background Circles */

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            animation: float 6s ease-in-out infinite;
        }

        .circle1 {
            width: 220px;
            height: 220px;
            background: #ff00cc;
            top: 8%;
            left: 12%;
        }

        .circle2 {
            width: 280px;
            height: 280px;
            background: #00ffff;
            bottom: 5%;
            right: 10%;
            animation-delay: 2s;
        }

        .circle3 {
            width: 120px;
            height: 120px;
            background: #ffff00;
            bottom: 20%;
            left: 25%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }
        }

        /* Glass Login Card */

        .login-container {
            position: relative;
            z-index: 10;

            width: 390px;
            padding: 45px 40px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.3);

            border-radius: 25px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.08);

            color: white;
        }

        /* Heading */

        .login-container h1 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            margin-bottom: 35px;
        }

        /* Input */

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 15px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
        }

        .input-group input {
            width: 100%;
            height: 50px;

            padding: 0 45px;

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;

            outline: none;

            background: rgba(255, 255, 255, 0.12);

            color: white;

            font-size: 15px;

            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .input-group input:focus {
            border-color: #00ffff;

            box-shadow:
                0 0 10px rgba(0, 255, 255, 0.5);

            background: rgba(255, 255, 255, 0.18);
        }

        /* Password Eye */

        .eye {
            position: absolute;
            right: 15px;
            top: 15px;

            cursor: pointer;

            color: rgba(255, 255, 255, 0.8);
        }

        /* Options */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 13px;

            margin-bottom: 25px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .options a {
            color: #fff;
            text-decoration: none;
        }

        .options a:hover {
            color: #00ffff;
        }

        /* Button */

        .login-btn {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #00ffff,
                #0066ff
            );

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(0, 153, 255, 0.4);

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(0, 255, 255, 0.5);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        /* Divider */

        .divider {
            display: flex;
            align-items: center;

            gap: 10px;

            margin: 25px 0;

            color: rgba(255, 255, 255, 0.6);

            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;

            background: rgba(255, 255, 255, 0.25);
        }

        /* Social Buttons */

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social {
            flex: 1;

            height: 45px;

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.1);

            color: white;

            cursor: pointer;

            font-size: 14px;

            transition: 0.3s;
        }

        .social:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Register */

        .register {
            text-align: center;

            margin-top: 28px;

            font-size: 14px;

            color: rgba(255, 255, 255, 0.75);
        }

        .register a {
            color: #00ffff;

            font-weight: bold;

            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .login-container {
                width: 90%;
                padding: 35px 25px;
            }

            .circle1 {
                width: 150px;
                height: 150px;
            }

            .circle2 {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>


    <!-- Login Card -->

    <div class="login-container">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to continue to your account
        </p>


        <!-- Email -->

        <div class="input-group">

            <i>✉</i>

            <input
                type="email"
                placeholder="Email Address"
            >

        </div>


        <!-- Password -->

        <div class="input-group">

            <i>🔒</i>

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <span
                class="eye"
                onclick="togglePassword()"
            >
                👁
            </span>

        </div>


        <!-- Options -->

        <div class="options">

            <label class="remember">

                <input type="checkbox">

                Remember me

            </label>

            <a href="#">
                Forgot Password?
            </a>

        </div>


        <!-- Login Button -->

        <button class="login-btn">
            Login
        </button>


        <!-- Divider -->

        <div class="divider">
            OR
        </div>


        <!-- Social -->

        <div class="social-buttons">

            <button class="social">
                🌐 Google
            </button>

            <button class="social">
                💼 LinkedIn
            </button>

        </div>


        <!-- Register -->

        <div class="register">

            Don't have an account?

            <a href="#">
                Create Account
            </a>

        </div>

    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }
        }

    </script>

</body>
<style>
    background: rgba(255, 255, 255, 0.12);
backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.3);
</style>
</html>
