<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent Login Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        /* Login Box */
        .login-box {
            width: 350px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);

            color: white;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
        }

        /* Input Box */
        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-box input {
            width: 100%;
            padding: 13px 15px;

            border: none;
            outline: none;
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.2);
            color: white;

            font-size: 15px;
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Remember + Forgot */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 13px;
            margin-bottom: 25px;
        }

        .options a {
            color: white;
            text-decoration: none;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: white;
            color: #764ba2;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #764ba2;
            color: white;
            transform: translateY(-2px);
        }

        /* Register */
        .register {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .register a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form>

            <div class="input-box">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="#">Register</a>
        </div>

    </div>


</body>
<style>
    background: rgba(255, 255, 255, 0.15);
backdrop-filter: blur(15px);
border: 1px solid rgba(255, 255, 255, 0.3);
</style>
</html>
